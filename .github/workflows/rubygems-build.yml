name: rubygems-build
# Builds the corvus_regex_ecma262 gems: the source gem, and native gems cross-compiled with rb-sys-dock for each
# platform, each holding the extension for Ruby 3.3, 3.4 and 4.0. Each native gem is then installed and tested on its
# own platform, with the oldest and newest of those Rubies, and the ECMA-262 test data (pinned to a commit) runs
# through it (on x86_64 Linux with Ruby 4.0, also for Unicode 13 and 18 and for the grammar of ECMAScript 2020, as the
# data's overlays write it). The test also checks that the gem is the only native gem
# RubyGems would offer that Ruby, and on Linux installs it by name from an index of all the gems. The gems are
# uploaded as artifacts named gem-*. Called by ci.yml (every change) and rubygems-publish.yml (a release), so a release pushes
# exactly what was built and tested here.
on:
  workflow_call:
    inputs:
      tag:
        # A release's tag (rubygems-publish.yml): its version is written into version.rb, the extension's Cargo.toml and
        # Cargo.lock, which hold 0.0.0, before the build (tools/release/stamp.ps1). CI passes v99.98.97, so that the
        # stamping runs in every build of every pull request, as a release runs it.
        type: string
        default: ''

permissions:
  contents: read

env:
  RUBY_VERSIONS: '3.3,3.4,4.0'

jobs:
  source:
    name: corvus_regex_ecma262 source gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      - name: Build
        # The source gem builds the extension where it is installed, fetching the crate from crates.io.
        run: |
          mkdir -p pkg
          gem build corvus_regex_ecma262.gemspec -o "pkg/corvus_regex_ecma262-$(ruby -Ilib -rcorvus_regex_ecma262/version -e 'print CorvusRegexEcma262::VERSION').gem"
          ls -l pkg
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-source
          path: pkg/*.gem
          if-no-files-found: error

  cross:
    name: corvus_regex_ecma262 gem (${{ matrix.gem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform is rb-sys-dock's name for the build, and gem is the platform of the gem it makes. The Rakefile
        # names the glibc gems -gnu.
        include:
          - { platform: x86_64-linux, gem: x86_64-linux-gnu }
          - { platform: aarch64-linux, gem: aarch64-linux-gnu }
          - { platform: x86_64-linux-musl, gem: x86_64-linux-musl }
          - { platform: aarch64-linux-musl, gem: aarch64-linux-musl }
          - { platform: x86_64-darwin, gem: x86_64-darwin }
          - { platform: arm64-darwin, gem: arm64-darwin }
          - { platform: x64-mingw-ucrt, gem: x64-mingw-ucrt }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Write the release's version
        if: inputs.tag != ''
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: ./tools/release/stamp.ps1 -Tag $env:TAG
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      - name: Cargo registry directory
        # rb-sys-dock bind-mounts ~/.cargo/registry into its container, but creates it relative to the working
        # directory (rb-sys 0.9.130), so on a fresh runner the mount fails.
        run: mkdir -p "$HOME/.cargo/registry"
      - name: Build
        uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ env.RUBY_VERSIONS }}
      - name: Check the gem
        id: gem
        # The action's gem-path output looks for a gem named for the build platform, which the glibc gems are not.
        env:
          GEM_PLATFORM: ${{ matrix.gem }}
        run: |
          ls -l pkg
          GEM=$(ls pkg/corvus_regex_ecma262-*-"$GEM_PLATFORM".gem)
          # The platform in the gem's metadata, which is what RubyGems goes by, not the file's name.
          [ "$(gem spec "$GEM" original_platform | sed -n 's/^--- //p')" = "$GEM_PLATFORM" ] \
            || { echo "::error::The metadata of $GEM does not say $GEM_PLATFORM."; exit 1; }
          echo "path=$GEM" >> "$GITHUB_OUTPUT"
          # One extension per Ruby version.
          gem spec "$GEM" files | grep -E 'lib/corvus_regex_ecma262/[0-9]+\.[0-9]+/corvus_regex_ecma262\.' | tee libs.txt
          for v in ${RUBY_VERSIONS//,/ }; do
            grep -q "lib/corvus_regex_ecma262/$v/" libs.txt || { echo "::error::No extension for Ruby $v."; exit 1; }
          done
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ matrix.gem }}
          path: ${{ steps.gem.outputs.path }}
          if-no-files-found: error

  test:
    name: corvus_regex_ecma262 gem test (${{ matrix.platform }}, Ruby ${{ matrix.ruby }})
    needs: [source, cross]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux-gnu, os: ubuntu-latest, ruby: '3.3' }
          - { platform: x86_64-linux-gnu, os: ubuntu-latest, ruby: '4.0', overlays: true }
          - { platform: aarch64-linux-gnu, os: ubuntu-24.04-arm, ruby: '3.3' }
          - { platform: aarch64-linux-gnu, os: ubuntu-24.04-arm, ruby: '4.0' }
          # The musl gems are tested in the official Alpine images, run with docker (JavaScript actions do not run in
          # Alpine containers on arm64).
          - { platform: x86_64-linux-musl, os: ubuntu-latest, ruby: '3.3', image: 'ruby:3.3-alpine' }
          - { platform: x86_64-linux-musl, os: ubuntu-latest, ruby: '4.0', image: 'ruby:4.0-alpine' }
          - { platform: aarch64-linux-musl, os: ubuntu-24.04-arm, ruby: '3.3', image: 'ruby:3.3-alpine' }
          - { platform: aarch64-linux-musl, os: ubuntu-24.04-arm, ruby: '4.0', image: 'ruby:4.0-alpine' }
          - { platform: x86_64-darwin, os: macos-15-intel, ruby: '3.3' }
          - { platform: x86_64-darwin, os: macos-15-intel, ruby: '4.0' }
          - { platform: arm64-darwin, os: macos-latest, ruby: '3.3' }
          - { platform: arm64-darwin, os: macos-latest, ruby: '4.0' }
          - { platform: x64-mingw-ucrt, os: windows-latest, ruby: '3.3' }
          - { platform: x64-mingw-ucrt, os: windows-latest, ruby: '4.0' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            docs
            test
            tools
      - name: Checkout the ECMA-262 test data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: corvus-dotnet/ecma262-regex-test-data
          ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
          path: ecma262-regex-test-data
          persist-credentials: false
      - name: Setup Ruby
        if: ${{ !matrix.image }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          path: gems
          merge-multiple: true
      - name: Install and test
        # The installed gem, not the sources: the tests run outside the gem's directory.
        env:
          IMAGE: ${{ matrix.image }}
          GEM_PLATFORM: ${{ matrix.platform }}
        run: |
          cat > test-gem.sh <<'SCRIPT'
          set -eu
          # On Windows, GITHUB_WORKSPACE is a path Ruby can open (sh's $PWD is an MSYS path); in docker it is unset.
          root="${GITHUB_WORKSPACE:-$PWD}"
          # Exactly one native gem of the release is for this Ruby. When two are (as a glibc gem named x86_64-linux and
          # the musl gem both were on Alpine), RubyGems before 4.0 installs either, by an ordering of its own.
          ruby -rrubygems/package -e '
            native = Dir["gems/*.gem"].map { |f| Gem::Package.new(f).spec }
            native.reject! { |s| s.platform == Gem::Platform::RUBY }
            matching = native.select { |s| Gem::Platform.match_spec?(s) }.map { |s| s.platform.to_s }
            expected = ENV["GEM_PLATFORM"]
            abort "The native gems for this Ruby are #{matching.inspect}, not only #{expected}." unless matching == [expected]'
          if [ "$(ruby -e 'print Gem::Platform.local.os')" = linux ]; then
            # As a user installs it: by name, from an index of every gem of the release, so RubyGems chooses between
            # the glibc gem, the musl gem and the source gem.
            gem install rubygems-generate_index
            mkdir -p index/gems
            cp gems/*.gem index/gems/
            (cd index && gem generate_index --directory .)
            gem install --clear-sources --source "file://$PWD/index" corvus_regex_ecma262
          else
            gem install --local gems/corvus_regex_ecma262-*-"$GEM_PLATFORM".gem
          fi
          gem install minitest -v '~> 5.25'
          ruby -e 'require "corvus_regex_ecma262"; puts CorvusRegexEcma262.crate_version, $LOADED_FEATURES.grep(/corvus_regex_ecma262\.(so|bundle|dll)/)'
          ruby -e 'require "corvus_regex_ecma262"
            platform = Gem.loaded_specs["corvus_regex_ecma262"].platform.to_s
            expected = ENV["GEM_PLATFORM"]
            abort "The #{platform} gem was installed, not the #{expected} one." unless platform == expected'
          ruby test/test_regex.rb
          # The examples of the getting-started page the documentation site publishes, through the installed gem.
          ruby test/test_getting_started.rb
          # The ECMA-262 test data through the installed gem: no wrong answer, refusal, acceptance of an invalid
          # pattern or match at its limit.
          ruby tools/dataset.rb "$root/ecma262-regex-test-data/data" wrong-cases.tsv
          SCRIPT
          if [ -n "$IMAGE" ]; then
            docker run --rm -e GEM_PLATFORM -v "$PWD:/w" -w /w "$IMAGE" sh test-gem.sh
          else
            sh test-gem.sh
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.overlays }}
        with:
          node-version: '24.22.1'
      - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
        # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
        # ECMAScript 2020 (edition.js apply), each judged through the installed gem set to match.
        if: ${{ matrix.overlays }}
        run: |
          data=ecma262-regex-test-data
          failed=()
          run() {
            name=$1; shift
            out="$RUNNER_TEMP/$name"
            case "$1" in
              unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
              edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
            esac
            shift 2
            ruby tools/dataset.rb "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
          }
          run unicode-13 unicode.js 13.0 --unicode 13
          run unicode-18 unicode.js 18.0 --unicode 18
          # An empty version is the data's own Unicode.
          run es2020 edition.js "" --edition es2020
          run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
