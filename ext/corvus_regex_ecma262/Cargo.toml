[package]
name = "corvus_regex_ecma262"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "The native extension of the corvus_regex_ecma262 gem: the corvus-regex-ecma262 crate over Ruby strings."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
corvus-regex-ecma262 = "0.2.5"
magnus = { version = "0.9.1", features = ["rb-sys"] }
rb-sys = "0.9.130"
