name: rubygems-publish
# Publishes the corvus_regex_ecma262 gem to RubyGems when a GitHub release is published: the native gems (one per
# platform, each with the extension for every supported Ruby) and then the source gem, all built and tested by
# rubygems-build.yml. The release's tag must be v<version> for VERSION in lib/corvus_regex_ecma262/version.rb (ci.yml
# checks it agrees with the extension's Cargo.toml). The source gem goes last, and its presence is what marks a
# version as published: a run that fails part of the way can be run again, and skips the native gems RubyGems has.
# A harness release (gh release create harness-<version>.<n> --latest=false), for a change to the benchmark harness
# alone, publishes the harness image and nothing here.
#
# It authenticates with RubyGems trusted publishing (OIDC): no API key is stored. The gem's trusted publisher on
# rubygems.org names this repository, this workflow file and the "rubygems" environment, so keep both names. A pending
# trusted publisher can be added before the gem exists, so the first version is published by this workflow too. A
# pushed version can be yanked but never replaced.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rubygems-publish
  cancel-in-progress: false

jobs:
  version:
    # A harness release (a tag starting harness-) publishes the harness image alone.
    if: ${{ !startsWith(github.event.release.tag_name, 'harness-') }}
    name: Version to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check the tag names this version and whether RubyGems has it
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^  VERSION = "\(.*\)"$/\1/p' lib/corvus_regex_ecma262/version.rb)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag is $TAG but version.rb says $version (the tag must be v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The source gem marks a version as published; RubyGems answers 404 for a version it does not have.
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/corvus_regex_ecma262/versions/$version.json")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::corvus_regex_ecma262 $version is already on RubyGems; nothing to publish." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::RubyGems answered $status for corvus_regex_ecma262 $version."
                 exit 1 ;;
          esac

  build:
    name: Build
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/rubygems-build.yml

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/corvus_regex_ecma262/versions/${{ needs.version.outputs.version }}
    permissions:
      id-token: write  # RubyGems trusted publishing
    steps:
      - name: Download the gems
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - name: Check the artifacts
        # Seven native gems (one per platform) and the source gem, all of this version.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l pkg
          [ "$(ls pkg/corvus_regex_ecma262-"$VERSION"-*.gem | wc -l)" -eq 7 ]
          [ -f "pkg/corvus_regex_ecma262-$VERSION.gem" ]
      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      - name: Authenticate with RubyGems
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: true
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for gem in pkg/corvus_regex_ecma262-"$VERSION"-*.gem; do
            # A native gem pushed by an earlier, failed run of this version is already there.
            if ! out=$(gem push "$gem" 2>&1); then
              echo "$out"
              echo "$out" | grep -q "Repushing of gem versions is not allowed" || exit 1
            else
              echo "$out"
            fi
          done
          gem push "pkg/corvus_regex_ecma262-$VERSION.gem"
          {
            echo "### corvus_regex_ecma262 $VERSION is published"
            echo
            echo "https://rubygems.org/gems/corvus_regex_ecma262/versions/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
